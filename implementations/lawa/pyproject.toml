[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawa-lab"
version = "0.1.0"
description = "A compact LaWa coarse-to-fine latent watermark mechanism adapter"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
official = ["diffusers>=0.31", "transformers>=4.44", "accelerate>=0.34"]

[project.scripts]
lawa-train = "rosteals_lab.train:main"
lawa-embed = "rosteals_lab.embed:main"
lawa-extract = "rosteals_lab.extract:main"
lawa-evaluate = "rosteals_lab.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
