[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-shading-lab"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26", "Pillow>=10.0", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
official = ["diffusers>=0.31", "transformers>=4.44", "accelerate>=0.34"]

[tool.setuptools.packages.find]
where = ["src"]
