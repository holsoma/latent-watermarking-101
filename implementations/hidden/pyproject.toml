[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-lab"
version = "0.1.0"
description = "A readable, experiment-first HiDDeN implementation lab"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
hidden-embed = "hidden_lab.embed:main"
hidden-extract = "hidden_lab.extract:main"
hidden-evaluate = "hidden_lab.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
